name: ci

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: sudo apt-get update && sudo apt-get install -y jq
      - run: bash -n scripts/imagegen.sh
      - run: python -m py_compile scripts/compliance_check.py scripts/test_offline.py
      - run: python scripts/test_offline.py
